<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Title</title>
<style>
  :root {
    --bg: #0b1220;
    --bg-alt: #101a2e;
    --gold: #c9a24b;
    --text: #eae6da;
    --text-muted: #a9a9b3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.6;
  }
  header {
    padding: 3rem 2rem;
    text-align: center;
    border-bottom: 1px solid rgba(201, 162, 75, 0.3);
  }
  header h1 {
    font-size: 2.5rem;
    letter-spacing: 0.05em;
    color: var(--gold);
  }
  header p {
    margin-top: 0.5rem;
    color: var(--text-muted);
    font-style: italic;
  }
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 3rem 1.5rem;
  }
  section {
    margin-bottom: 2.5rem;
  }
  h2 {
    color: var(--gold);
    font-weight: normal;
    border-bottom: 1px solid rgba(201, 162, 75, 0.2);
    padding-bottom: 0.5rem;
    margin-bottom: 1rem;
  }
  footer {
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
    font-size: 0.9rem;
    border-top: 1px solid rgba(201, 162, 75, 0.3);
  }
</style>
</head>
<body>

<header>
  <h1>Jenkins</h1>
  <p>A Jenkins project</p>
</header>

<main>
  <section>
    <h2>About</h2>
    <p>Connecting to jenkins.</p>
  </section>

  <section>
    <h2>Details</h2>
    <p>Add more sections as needed.</p>
  </section>
</main>

<footer>
  &copy; 2026 arjun</footer>

</body>
</html>
